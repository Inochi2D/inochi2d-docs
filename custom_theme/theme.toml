[theme]
inherit = "none"
stylesheets = [
    "style.css",
]
sidebars = [
    "localtoc.html",
]
pygments_style = { default = "none" }

[options]
nosidebar = "false"
sidebarwidth = "230"
body_min_width = "360"
body_max_width = "800"
navigation_with_keys = "False"
enable_search_shortcuts = "True"
globaltoc_collapse = "true"
globaltoc_includehidden = "false"
globaltoc_maxdepth = ""
extra_nav_links = {}
sidebar_collapse = true
sidebar_includehidden = true
